upstream telegraf {
	server localhost:9273;
}

server {
	listen 9292;
	listen [::]:9292;
	server_name telegraf.cloud.home;

	include /etc/nginx/snippets/syslog-logging.conf;
	root /usr/share/nginx/www;
	index index.html index.htm;

	location / {
		proxy_set_header Host $host;
		proxy_pass http://telegraf;
	}
}
