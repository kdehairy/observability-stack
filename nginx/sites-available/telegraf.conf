upstream telegraf {
	server localhost:9273;
}

server {
	listen 9292;
	listen [::]:9292;
	server_name telegraf.cloud.home;

	access_log syslog:server=127.0.0.1:514,tag=nginx_telegraf;
	error_log syslog:server=127.0.0.1:514,tag=nginx_telegraf;
	root /usr/share/nginx/www;
	index index.html index.htm;

	location / {
		proxy_set_header Host $host;
		proxy_pass http://telegraf;
	}
}
