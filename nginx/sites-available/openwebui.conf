# External Nginx configuration for OpenWebUI SSL termination
# Forwards SSL traffic from internet to internal nginx at darwish.cloud.home:80

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting. Each zone is self-scoping by its key: nginx skips a request
# whose zone key comes out empty, so these maps decide which requests each zone
# counts (same pattern as homeassistant.conf). Declared here rather than in
# nginx.conf because the key is only meaningful to this vhost; the include of
# sites-enabled lives inside http{}, and map/limit_req_zone may not appear
# inside server{}.
#
# General zone: everything except the content-hashed OpenWebUI bundle. A cold
# frontend load fires ~300 /_app/immutable/* chunks within ~1s - 56% of this
# vhost's requests - and counting them returned 429 on the app's own JS, so the
# SPA could not boot and served a blank page while OpenWebUI was healthy.
map $uri $openwebui_general_key {
    ~^/(_app|static)/   "";
    default             $binary_remote_addr;
}

# Auth zone: the interactive login flow only, to blunt credential stuffing. A
# real signin is 2 requests (auth config + POST signin), which the burst covers.
# Session traffic (GET /api/v1/auths/, /update/timezone, signout) deliberately
# stays in the general zone, so a quick reload can never 429 a user's own
# session and show them as logged out.
map $uri $openwebui_auth_key {
    ~^/api/v1/auths/(signin|signup|password/change|reset)  $binary_remote_addr;
    ~^/(oauth|sso)/                                        $binary_remote_addr;
    default                                                "";
}

limit_req_zone $openwebui_general_key zone=openwebui_general:10m rate=20r/s;
limit_req_zone $openwebui_auth_key    zone=openwebui_auth:10m    rate=6r/m;

upstream openwebui_backend {
    server darwish.cloud.home:80;
    keepalive 128;
    keepalive_timeout 1800s;
    keepalive_requests 10000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name darwish.eldoheiri.com;  # REPLACE with your actual domain (e.g., openwebui.yourdomain.com)

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server configuration - SSL termination only
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name darwish.eldoheiri.com;  # REPLACE with your actual domain

    # SSL Certificate paths - update these to match your Let's Encrypt cert location
    ssl_certificate /etc/letsencrypt/live/darwish.eldoheiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darwish.eldoheiri.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    # Logging
    access_log /var/log/nginx/openwebui_access.json json_combined;
    error_log /var/log/nginx/openwebui_error.log;

    # Hardening: mass internet scanners constantly probe for leftover
    # PHP/WordPress/.env/.git artifacts. OpenWebUI's SPA fallback would
    # otherwise return 200 for all of these, so block them here before
    # they reach the backend. The 403 also gives fail2ban a clean signal
    # to ban repeat offenders (see fail2ban/filter.d/openwebui-scanners.conf).
    location ~* (\.env|phpinfo|wp-admin|wp-login|\.git/|xmlrpc\.php|\.aws/credentials|_profiler|\.docker/|\.ssh/|eval-stdin) {
        return 403;
    }

    # Hardening: volumetric rate limits for the whole vhost, independent of
    # response status (protects against scan/DoS volume regardless of what
    # the backend returns). Both zones are applied here, at server level,
    # because a limit_req inside a location *replaces* the limit inherited from
    # this level instead of adding to it - the auth location used to escape the
    # general zone completely. Each zone scopes itself by key (see nginx.conf),
    # so the immutable /_app/ + /static/ bundle is not counted at all and only
    # the interactive login flow is counted by the tight auth zone. Auth is
    # declared first because nginx checks zones in order and logs the first one
    # that rejects, which puts credential stuffing under openwebui_auth.
    limit_req zone=openwebui_auth    burst=5  nodelay;
    limit_req zone=openwebui_general burst=40 nodelay;
    limit_req_status 429;

    location /api/v1/auths/ {
        proxy_pass http://openwebui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host darwish.cloud.home;
        proxy_set_header Origin "http://darwish.cloud.home";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        proxy_read_timeout 1800;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        client_max_body_size 20M;
    }

    # Forward all requests to internal nginx
    location / {
        proxy_pass http://openwebui_backend;
        proxy_http_version 1.1;

        # Forward all necessary headers
        # Host must match the internal nginx's server_name (darwish.cloud.home)
        proxy_set_header Host darwish.cloud.home;
        # OpenWebUI's WebSocket handshake validates Origin against Host;
        # since Host is rewritten above, Origin must match or upgrades get a bare 403.
        proxy_set_header Origin "http://darwish.cloud.home";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for Socket.IO streaming of chat replies)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Extended timeout for long LLM completions
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        proxy_read_timeout 1800;

        # Disable buffering and compression for streaming responses
        # (gzip would buffer chunks waiting to fill a compression block,
        # delaying/blocking SSE-style streamed chat replies)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        client_max_body_size 20M;
    }
}
