# External Nginx configuration for OpenWebUI SSL termination
# Forwards SSL traffic from internet to internal nginx at darwish.cloud.home:80

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openwebui_backend {
    server darwish.cloud.home:80;
    keepalive 128;
    keepalive_timeout 1800s;
    keepalive_requests 10000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name darwish.eldoheiri.com;  # REPLACE with your actual domain (e.g., openwebui.yourdomain.com)

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server configuration - SSL termination only
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name darwish.eldoheiri.com;  # REPLACE with your actual domain

    # SSL Certificate paths - update these to match your Let's Encrypt cert location
    ssl_certificate /etc/letsencrypt/live/darwish.eldoheiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darwish.eldoheiri.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    # Logging
    access_log /var/log/nginx/openwebui_access.log;
    error_log /var/log/nginx/openwebui_error.log;

    # Forward all requests to internal nginx
    location / {
        proxy_pass http://openwebui_backend;
        proxy_http_version 1.1;
        
        # Forward all necessary headers
        # Host must match the internal nginx's server_name (darwish.cloud.home)
        proxy_set_header Host darwish.cloud.home;
        # OpenWebUI's WebSocket handshake validates Origin against Host;
        # since Host is rewritten above, Origin must match or upgrades get a bare 403.
        proxy_set_header Origin "http://darwish.cloud.home";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for Socket.IO streaming of chat replies)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Extended timeout for long LLM completions
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        proxy_read_timeout 1800;
        
        # Disable buffering and compression for streaming responses
        # (gzip would buffer chunks waiting to fill a compression block,
        # delaying/blocking SSE-style streamed chat replies)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        client_max_body_size 20M;
    }
}
