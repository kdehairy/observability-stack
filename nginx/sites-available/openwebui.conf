# External Nginx configuration for OpenWebUI SSL termination
# Forwards SSL traffic from internet to internal nginx at darwish.cloud.home:80

upstream openwebui_backend {
    server darwish.cloud.home:80;
    keepalive 128;
    keepalive_timeout 1800s;
    keepalive_requests 10000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name darwish.eldoheiri.com;  # REPLACE with your actual domain (e.g., openwebui.yourdomain.com)

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server configuration - SSL termination only
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name darwish.eldoheiri.com;  # REPLACE with your actual domain

    # SSL Certificate paths - update these to match your Let's Encrypt cert location
    ssl_certificate /etc/letsencrypt/live/darwish.eldoheiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darwish.eldoheiri.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Logging
    access_log /var/log/nginx/openwebui_access.log;
    error_log /var/log/nginx/openwebui_error.log;

    # Forward all requests to internal nginx
    location / {
        proxy_pass http://openwebui_backend;
        proxy_http_version 1.1;
        
        # Forward all necessary headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for long LLM completions
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        proxy_read_timeout 1800;
        
        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 20M;
    }
}
