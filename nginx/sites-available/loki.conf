server {
    listen 80;
    server_name loki.cloud.home;

    # Logging
    access_log /var/log/nginx/loki_access.log;
    error_log /var/log/nginx/loki_error.log;
    access_log syslog:server=127.0.0.1:514,tag=nginx_loki;
    error_log syslog:server=127.0.0.1:514,tag=nginx_loki;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Loki-specific headers
        proxy_set_header X-Scope-OrgID $http_x_scope_orgid;
    }

    location /loki/api/ {
        proxy_pass http://127.0.0.1:3100/loki/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}