map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zone - 10 requests/second per IP, burst of 20
limit_req_zone $binary_remote_addr zone=ha_limit:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name homeassistant.eldoheiri.com;

    ssl_certificate     /etc/letsencrypt/live/homeassistant.eldoheiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homeassistant.eldoheiri.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    # Logging
    access_log /var/log/nginx/homeassistant_access.log;
    error_log /var/log/nginx/homeassistant_error.log;
    include /etc/nginx/snippets/syslog-logging.conf;

    # HTTP Strict Transport Security.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;

    # RATE LIMITING
    limit_req zone=ha_limit burst=20 nodelay;

    # PROXY TIMEOUTS
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://homeassistant.home:8123;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable response buffering. For HA's streaming responses and WebSockets
        # this causes hangs
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name homeassistant.eldoheiri.com;
    return 301 https://$host$request_uri;
}
