map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zone - 10 requests/second per IP, burst of 20
limit_req_zone $binary_remote_addr zone=ha_limit:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name homeassistant.eldoheiri.com;

    ssl_certificate     /etc/letsencrypt/live/homeassistant.eldoheiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homeassistant.eldoheiri.com/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;

    # RATE LIMITING
    limit_req zone=ha_limit burst=20 nodelay;

    # PROXY TIMEOUTS
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://homeassistant.home:8123;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable response buffering. For HA's streaming responses and WebSockets
        # this causes hangs
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name homeassistant.eldoheiri.com;
    return 301 https://$host$request_uri;
}
