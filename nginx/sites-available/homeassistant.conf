map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting. nginx skips a request when its zone key is empty, so these
# maps decide which requests each zone counts.
#
# General zone: everything except the content-hashed frontend assets. A cold
# HA frontend load (especially the Android app, which sends HEAD + GET for
# each chunk) fires hundreds of /frontend_latest/*.js and /static/* requests
# within ~1s over a single HTTP/2 connection. Limiting those caused 503s on
# random chunks and a blank UI.
map $uri $ha_limit_key {
    ~^/(frontend_latest|frontend_es5|static|hacsfiles)/  "";
    default                                              $binary_remote_addr;
}

# Auth zone: only the interactive login flow, to blunt credential stuffing.
# A normal login takes 2-3 requests here (create flow, submit credentials,
# optional MFA step), which the burst covers.
map $uri $ha_auth_key {
    ~^/auth/login_flow  $binary_remote_addr;
    default             "";
}

limit_req_zone $ha_limit_key zone=ha_limit:10m rate=30r/s;
limit_req_zone $ha_auth_key  zone=ha_auth:10m  rate=6r/m;

server {
    listen 443 ssl;
    server_name homeassistant.eldoheiri.com;

    ssl_certificate     /etc/letsencrypt/live/homeassistant.eldoheiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homeassistant.eldoheiri.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    # Logging
    access_log /var/log/nginx/homeassistant_access.json json_combined;
    error_log /var/log/nginx/homeassistant_error.log;

    # HTTP Strict Transport Security.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;

    # RATE LIMITING (see the maps above for what each zone counts).
    # 429 instead of the default 503, so limiter hits can't be mistaken for
    # an upstream failure in the logs.
    limit_req zone=ha_limit burst=100 nodelay;
    limit_req zone=ha_auth  burst=5   nodelay;
    limit_req_status 429;

    # PROXY TIMEOUTS
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://homeassistant.home:8123;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable response buffering. For HA's streaming responses and WebSockets
        # this causes hangs
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name homeassistant.eldoheiri.com;
    return 301 https://$host$request_uri;
}
