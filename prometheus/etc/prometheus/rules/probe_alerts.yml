groups:
  - name: blackbox
    rules:
      - alert: ProbeDown
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "Probe for {{ $labels.instance }} (job: {{ $labels.job }}) has been failing for more than 5 minutes."
