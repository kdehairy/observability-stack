scrape_configs:
  - job_name: "hass"
    scrape_interval: 60s
    metrics_path: /api/prometheus

    scheme: http
    static_configs:
      - targets: ['homeassistant.home:8123']
  
  - job_name: "cloud"
    scrape_interval: 60s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['cloud.home:9292']

  - job_name: 'ai'
    scrape_interval: 30s
    static_configs:
      - targets: ['ai.home:9100']
  
  - job_name: 'ai-amd_gpu'
    scrape_interval: 30s
    static_configs:
      - targets: ['ai.home:5000']

  - job_name: 'ai-llama'
    scrape_interval: 30s
    static_configs:
      - targets: ['ai.home:8082']
    metrics_path: /metrics
