# Single source of truth for the ntfy (https://ntfy.sh) notification format
# used by every webhook receiver in alertmanager.yml.
#
# Uses the same title/message/priority schema as ntfy's own custom template
# files (https://docs.ntfy.sh/publish/#using-a-custom-template). `make
# alertmanager-config` (a dependency of `make install-alertmanager`) renders
# these as ntfy inline-template (template=yes) query parameters and
# URL-encodes them into alertmanager.yml, generated from alertmanager.yml.tpl.
#
# Priority is computed here from the alert's own severity label, so a single
# receiver per ntfy topic covers every severity (critical -> urgent, warning
# -> high, info -> low, anything else -> default).
title: |
  {{ if eq .status "firing" }}🚨 Alert: {{ (first .alerts).labels.instance }}{{ else }}✅ Resolved: {{ (first .alerts).labels.instance }}{{ end }}
message: |
  Severity: {{ (first .alerts).labels.severity }}
  Starts at: {{ (first .alerts).startsAt }}
  {{ if eq (first .alerts).status "resolved" }}Ends at: {{ (first .alerts).endsAt }}
  {{ end }}{{ if (first .alerts).annotations.summary }}Summary: {{ (first .alerts).annotations.summary }}
  {{ end }}{{ if (first .alerts).annotations.description }}Description: {{ (first .alerts).annotations.description }}
  {{ end }}Source: {{ (first .alerts).generatorURL }}
priority: |
  {{ if eq (first .alerts).labels.severity "critical" }}urgent{{ else if eq (first .alerts).labels.severity "warning" }}high{{ else if eq (first .alerts).labels.severity "info" }}low{{ else }}default{{ end }}
