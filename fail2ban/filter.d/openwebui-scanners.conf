# Matches requests nginx has already rejected with 403 (known scanner
# signatures - see the location block in nginx/sites-available/openwebui.conf)
# or 429 (rate-limit exceeded). Legitimate OpenWebUI clients never hit
# either, so any match here is unambiguous scanning/abuse.
#
# The 429 half of this depends on the zone keying in nginx/nginx.conf staying
# frontend-aware: if the content-hashed /_app/ bundle is put back into a
# counted zone, a normal page load produces hundreds of 429s and this filter
# bans whoever loaded the page (see .plans/openwebui-ratelimit-429-fix.md).
# Keep the ignoreip list in jail.d/openwebui.conf as the second line of defence.
[Definition]
failregex = ^\{.*"remote_addr":"<HOST>".*"status":(?:403|429),.*"virtual_host":"darwish\.eldoheiri\.com".*$
ignoreregex =
datepattern = ^\{"time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z"
