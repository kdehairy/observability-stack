# Matches requests nginx has already rejected with 403 (known scanner
# signatures - see the location block in nginx/sites-available/openwebui.conf)
# or 429 (rate-limit exceeded). Legitimate OpenWebUI clients never hit
# either, so any match here is unambiguous scanning/abuse.
[Definition]
failregex = ^\{.*"remote_addr":"<HOST>".*"status":(?:403|429),.*"virtual_host":"darwish\.eldoheiri\.com".*$
ignoreregex =
datepattern = ^\{"time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z"
