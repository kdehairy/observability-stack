# Bans repeat scanner/abuse traffic against the internet-facing OpenWebUI
# vhost. Relies on nginx/sites-available/openwebui.conf returning 403 for
# known scanner signatures and 429 on rate-limit, matched by
# filter.d/openwebui-scanners.conf. Uses nftables (not iptables) actions
# since the host firewall is nftables-managed (see ../../nftables.conf).
[openwebui-scanners]
enabled  = true
filter   = openwebui-scanners
logpath  = /var/log/nginx/openwebui_access.json
backend  = auto
# Never ban internal addresses. *.eldoheiri.com resolves to the public WAN IP
# and the router hairpins with MASQUERADE, so every LAN request reaches nginx
# with the router's LAN address as its client. Banning that is a house-wide
# outage, not a ban of one misbehaving device. Safe to exempt because this key
# is the direct TCP peer, not a header an attacker controls.
ignoreip = 127.0.0.1/8 ::1 192.168.50.0/24 10.6.0.0/24
maxretry = 3
findtime = 10m
bantime  = 24h
action   = nftables-multiport[name=openwebui-scanners, port="http,https", protocol=tcp]
