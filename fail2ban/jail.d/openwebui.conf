# Bans repeat scanner/abuse traffic against the internet-facing OpenWebUI
# vhost. Relies on nginx/sites-available/openwebui.conf returning 403 for
# known scanner signatures and 429 on rate-limit, matched by
# filter.d/openwebui-scanners.conf. Uses nftables (not iptables) actions
# since the host firewall is nftables-managed (see ../../nftables.conf).
[openwebui-scanners]
enabled  = true
filter   = openwebui-scanners
logpath  = /var/log/nginx/openwebui_access.json
backend  = auto
maxretry = 3
findtime = 10m
bantime  = 24h
action   = nftables-multiport[name=openwebui-scanners, port="http,https", protocol=tcp]
