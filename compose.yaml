services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    user: "969:968" #prometheus
    ports:
      - 9090:9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      #- --storage.tsdb.retention.time 2y
      - '--storage.tsdb.retention.size=256GB'
      - '--web.enable-admin-api'
    volumes:
      - type: bind
        source: /home/prometheus/.prometheus/etc/prometheus
        target: /etc/prometheus
      - type: bind
        source: /home/prometheus/.prometheus/prometheus
        target: /prometheus
    restart: unless-stopped
    dns:
      - 192.168.50.1
    dns_opt:
      - NO-RETRY-SEARCH-DOMAINS

  grafana:
    image: grafana/grafana
    container_name: grafana
    user: "969:968" #prometheus
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=heroHERO
    volumes:
      - type: bind
        source: /home/prometheus/.grafana/var/lib/grafana
        target: /var/lib/grafana
      - type: bind
        source: /home/prometheus/.grafana/etc/grafana
        target: /etc/grafana
    restart: unless-stopped
    dns:
      - 192.168.50.1
    dns_opt:
      - NO-RETRY-SEARCH-DOMAINS

  uptime-kuma:
    image: louislam/uptime-kuma:2.1.3
    container_name: uptime-kuma
    #user: "969:968" #prometheus
    ports:
      - "3001:3001"  # This maps the container port "3001" to the host port "3001"
    volumes:
      - type: bind
        source: /home/prometheus/.uptimekuma/data
        target: /app/data
    environment:
      - TZ=UTC  # Set the timezone (change to your preferred local timezone so monitoring times are the same)
      - UMASK=0022  # Set your file permissions manually
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    dns:
      - 192.168.50.1
    dns_opt:
      - NO-RETRY-SEARCH-DOMAINS

networks:
  default:
    name: monitoring_network
