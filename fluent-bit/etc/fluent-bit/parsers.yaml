parsers:
  - name: syslog-rfc5424
    format: regex
    regex: '^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$'
    time_key: time
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: true

  - name: json
    format: json

  - name: nginx-error
    format: regex
    regex: '^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} \[(?<severity>\w+)\] (?<pid>\d+)#\d+: (?:\*\d+ )?(?<message>.+)$'
