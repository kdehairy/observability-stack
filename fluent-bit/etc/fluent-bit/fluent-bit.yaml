service:
  flush: 5
  log_level: info
  parsers_file: /etc/fluent-bit/parsers.yaml

pipeline:
  inputs:
    - name: syslog
      parser: syslog-rfc5424
      listen: 0.0.0.0
      port: 5140
      mode: tcp
      tag: nginx.access.<ident>

  filters:
    - name: parser
      match: nginx.access.*
      key_name: message
      parser: json
      reserve_data: true

    - name: lua
      match: nginx.access.*
      script: /etc/fluent-bit/nginx_filters.lua
      call: status_class

  outputs:
    - name: loki
      match: nginx.access.*
      host: loki
      port: 3100
      labels: job=nginx_access, host=$host
      label_keys: $ident,$status_class,$request_method
      remove_keys: status_class
