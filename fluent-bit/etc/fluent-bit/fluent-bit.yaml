service:
  flush: 5
  log_level: info
  parsers_file: /etc/fluent-bit/parsers.yaml

pipeline:
  inputs:
    - name: syslog
      parser: syslog-rfc5424
      listen: 0.0.0.0
      port: 5140
      mode: tcp

    - name: syslog
      parser: syslog-rfc3164-local
      listen: 0.0.0.0
      port: 5140
      mode: udp

  filters:
    - name: modify
      match: '*'
      copy: ident service_name

  outputs:
    - name: loki
      match: '*'
      host: loki
      port: 3100
      labels: job=fluentbit
      label_keys: $host,$ident,$pid,$service_name
