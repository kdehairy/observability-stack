service:
  flush: 5
  log_level: info
  parsers_file: /etc/fluent-bit/parsers.yaml

pipeline:
  inputs:
    - name: syslog
      parser: syslog-rfc5424
      listen: 0.0.0.0
      port: 5140
      mode: tcp
      tag: syslog

  filters:
    - name: rewrite_tag
      match: syslog
      rule: "$ident ^nginx\\.access\\. nginx.access false"
      rule: "$ident ^nginx\\.error\\. nginx.error false"
      emitter_name: nginx_emitter

    - name: parser
      match: nginx.access
      key_name: message
      parser: json
      reserve_data: true

    - name: lua
      match: nginx.access
      script: /etc/fluent-bit/nginx_filters.lua
      call: status_class

    - name: parser
      match: nginx.error
      key_name: message
      parser: nginx-error
      reserve_data: true

    - name: lua
      match: nginx.error
      script: /etc/fluent-bit/nginx_filters.lua
      call: error_class

    - name: lua
      match: 'nginx.*'
      script: /etc/fluent-bit/nginx_filters.lua
      call: ident_fix

  outputs:
    - name: loki
      match: nginx.access
      host: loki
      port: 3100
      labels: job=nginx_access, host=$host
      label_keys: $ident,$status_class,$request_method
      remove_keys: status_class

    - name: loki
      match: nginx.error
      host: loki
      port: 3100
      labels: job=nginx_error, host=$host
      label_keys: $ident,$level
      remove_keys: level
