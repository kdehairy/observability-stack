service:
  flush: 5
  log_level: info
  parsers_file: /fluent-bit/etc/parsers.conf

pipeline:
  inputs:
    - name: syslog
      parser: syslog-rfc5424
      listen: 0.0.0.0
      port: 5140
      mode: tcp

  outputs:
    - name: loki
      match: '*'
      host: loki
      port: 3100
      labels: job=fluentbit
      label_keys: $host,$ident,$pid
